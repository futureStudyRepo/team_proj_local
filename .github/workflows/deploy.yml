name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: |
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate bio4
          pip install -r requirements.txt
          tmux kill-session -t myapp 2>/dev/null || true
          tmux new-session -d -s myapp ~/start_app.sh
